  - name: Get survey min date per period
    id: survey_min_date
    task: get_survey_min_date
    mapvalues:
      argnames: patrol_events
      argvalues: ${{ workflow.period_patrol_events.return }}

  - name: Zip transects with survey min date
    id: zip_transects_min_date
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.reproject_transects.return }}
        - ${{ workflow.survey_min_date.return }}

  - name: Add since filter to transect df
    id: add_since_transects
    task: add_constant_column
    partial:
      column: "survey_date"
    mapvalues:
      argnames:
        - df
        - value
      argvalues: ${{ workflow.zip_transects_min_date.return }}

  - name: Convert transects to feature collection
    id: convert_trans_ee
    task: to_ee_feature_collection
    partial:
      client: ${{ workflow.gee_client.return }}
    mapvalues:
      argnames: gdf
      argvalues: ${{ workflow.add_since_transects.return }}

  - name: Zip aoi with survey min date
    id: zip_aoi_min_date
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.convert_trans_ee.return }}
        - ${{ workflow.survey_min_date.return }}

  - name: Build hls ndvi image
    id: hls_ndvi_image
    task: build_hls_ndvi_image
    partial:
      client: ${{ workflow.gee_client.return }}
      ndvi_window_days: null
      max_cloud_cover: 30
      ndvi_band_name: "NDVI_HSL"
    mapvalues:
      argnames:
        - aoi
        - since
      argvalues: ${{ workflow.zip_aoi_min_date.return }}

  - name: Build slope image
    id: create_slope_image
    task: build_slope_image
    partial:
      client: ${{ workflow.gee_client.return }}
      dem_asset: "USGS/SRTMGL1_003"

  - name: Build palsar woody cover image
    id: woody_cover_image
    task: build_palsar_woody_cover_image
    partial:
      client: ${{ workflow.gee_client.return }}
      dry_season_start_month: 7
      dry_season_end_month: 9
      woody_cover_band_name: "WoodyCover"
    mapvalues:
      argnames:
        - aoi
        - since
      argvalues: ${{ workflow.zip_aoi_min_date.return }}

  - name: Add NDVI_HSL column to transects column 
    id: label_ndvi_hsl 
    task: label_features_with_image_stat
    partial: 
      image: ${{ workflow.create_slope_image.return }}
      out_column: "NDVI_HSL"
      region_reducer: null 
      scale: 30.0 
      reducer_key: mean 
    mapvalues: 
      argnames: gdf 
      argvalues:  ${{ workflow.add_since_transects.return }}
  
  - name: Zip ndvi df with survey min date
    id: zip_ndvi_min_date
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.label_ndvi_hsl.return }}
        - ${{ workflow.survey_min_date.return }}

  - name: Add img_date_hsl_ndvi to transects column
    id: add_img_date_hsl_ndvi
    task: add_constant_column
    partial:
      column: "img_date_hsl_ndvi"
    mapvalues:
      argnames:
        - df
        - value
      argvalues: ${{ workflow.zip_ndvi_min_date.return }}

  - name: Add slope column to transects column
    id: label_slope
    task: label_features_with_image_stat
    partial:
      image: ${{ workflow.create_slope_image.return }}
      out_column: "slope"
      region_reducer: null
      scale: 30.0
      reducer_key: mean
    mapvalues:
      argnames: gdf
      argvalues: ${{ workflow.add_img_date_hsl_ndvi.return }}

  - name: Zip transects with woody cover image
    id: zip_woody_cover_image
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.label_slope.return }}
        - ${{ workflow.woody_cover_image.return }}

  - name: Add woody cover column to transects column
    id: label_woody_cover
    task: label_features_with_image_stat
    partial:
      out_column: "WoodyCover"
      region_reducer: null
      scale: 50.0
      reducer_key: mean
    mapvalues:
      argnames:
        - gdf
        - image
      argvalues: ${{ workflow.zip_woody_cover_image.return }}

  - name: Filter column transects for merging with patrol events
    id: filter_transect_columns
    task: select_columns
    partial:
      columns: [
        "name",
        "img_date_hsl_ndvi",
        "NDVI_HSL",
        "slope",
        "WoodyCover",
        "geometry"
        ]
      raise_on_missing: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.label_woody_cover.return }}

  - name: Exclude geometry from transects
    id: exclude_geom
    task: select_columns
    partial:
      columns: [
        "name",
        "img_date_hsl_ndvi",
        "NDVI_HSL",
        "slope",
        "WoodyCover",
        ]
      raise_on_missing: true
    mapvalues: 
      argnames: df 
      argvalues: ${{ workflow.filter_transect_columns.return }}

  - name: Zip patrols df and transects df
    id: zip_patrol_transects_df
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.filter_intersecting_events.return }}
        - ${{ workflow.exclude_geom.return }}

  - name: Merge patrol events with transects 
    id: merge_filtered_patrols
    task: merge_two_dataframes
    partial: 
      left_on: "transect_id"
      right_on: name
      how: left 
      left_index: false
      right_index: false
      fillna_value: null 
      on: null 
    mapvalues:
      argnames:
        - left
        - right 
      argvalues: ${{ workflow.zip_patrol_transects_df.return }}
      
  - name: Select patrol event columns for export 
    id: select_patrol_event_cols 
    task: select_columns 
    partial: 
      columns: [
        "transect_id", "level_1", "title", 
        "patrol_id", "patrol_serial_number",
        "totalcount", "num_juveniles", "event_type", 
        "num_observers", "dist_to_centre","geometry",
        "species", "other_species","time", "serial_number", 
        "radialangle", "survey_id","off_transect_dist", 
        "orig_geometry", "ortho_dist", "intersects_transect",
        "img_date_hsl_ndvi","NDVI_HSL", "slope"
      ]
      raise_on_missing: false
    mapvalues:
      argnames: df 
      argvalues: ${{ workflow.merge_filtered_patrols.return }}

  - name: Combine survey name with patrol events for filename
    id: combine_patrol_event_names
    task: join_with_underscore
    partial:
      second: analysis_data
    mapvalues:
      argnames: first
      argvalues: ${{ workflow.combine_survey_period_name.return }}

  - name: Zip filename with patrol events dataframe
    id: zip_filename_patrol_df
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combine_patrol_event_names.return }}
        - ${{ workflow.select_patrol_event_cols.return }}

  - name: Persist patrol events as csv
    id: persist_patrol_events_csv
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
    mapvalues:
      argnames:
        - filename
        - df
      argvalues: ${{ workflow.zip_filename_patrol_df.return }}

  - name: Select columns to persist as gpkg 
    id: select_gpkg_columns
    task: select_columns
    partial:
      columns: [
        "serial_number", "transect_id", "dist_to_centre",
        "ortho_dist", "intersects_transect", "geometry"
      ]
      raise_on_missing: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.select_patrol_event_cols.return }}

  - name: Combine survey name with patrol events for gpkg filename
    id: combine_gpkg_name
    task: join_with_underscore
    partial:
      second: events
    mapvalues:
      argnames: first
      argvalues: ${{ workflow.combine_survey_period_name.return }}

  - name: Zip filename with gpkg columns df
    id: zip_filename_gpkg_df
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combine_gpkg_name.return }}
        - ${{ workflow.select_gpkg_columns.return }}

  - name: Persist patrol events as gpkg
    id: persist_patrol_events_gpkg
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: gpkg
    mapvalues:
      argnames:
        - filename
        - df
      argvalues: ${{ workflow.zip_filename_gpkg_df.return }}

  - name: Convert all name values in transects to lowercase
    id: format_transect_names
    task: format_text_column
    partial:
      column: name
      method: lower
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.filter_transect_columns.return }}

  - name: Combine survey name with transects for gpkg filename
    id: combine_transect_gpkg_name
    task: join_with_underscore
    partial:
      second: transect_areas
    mapvalues:
      argnames: first
      argvalues: ${{ workflow.combine_survey_period_name.return }}

  - name: Zip filename with transects df for gpkg export
    id: zip_filename_transect_df
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combine_transect_gpkg_name.return }}
        - ${{ workflow.format_transect_names.return }}

  - name: Persist transects as gpkg
    id: persist_transects_gpkg
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: gpkg
    mapvalues:
      argnames:
        - filename
        - df
      argvalues: ${{ workflow.zip_filename_transect_df.return }}

  # Transect lines: the same visited subset as "transect_areas" above, but with
  # the simplified line geometry (pre-buffering) instead of the buffered polygon.
  - name: Zip transect lines with visited transects
    id: zip_lines_visited
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.simplify_tolerance.return }}
        - ${{ workflow.visited_transects.return }}

  - name: Filter transect lines to only visited transects
    id: visited_transect_lines
    task: filter_transect_lines_by_visited
    partial: 
      name_column: name
    mapvalues:
      argnames:
        - lines
        - visited
      argvalues: ${{ workflow.zip_lines_visited.return }}

  - name: Reproject transect lines back to epsg:4326 for export
    id: reproject_transect_lines
    task: reproject_gdf
    partial:
      target_crs: "epsg:4326"
    mapvalues:
      argnames: gdf
      argvalues: ${{ workflow.visited_transect_lines.return }}

  - name: Combine survey name with transect lines for gpkg filename
    id: combine_transect_lines_gpkg_name
    task: join_with_underscore
    partial:
      second: transect_lines
    mapvalues:
      argnames: first
      argvalues: ${{ workflow.combine_survey_period_name.return }}

  - name: Zip filename with transect lines df for gpkg export
    id: zip_filename_transect_lines_df
    skipif:
      conditions:
        - any_dependency_skipped
        - any_keyed_iterables_are_skips
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.combine_transect_lines_gpkg_name.return }}
        - ${{ workflow.reproject_transect_lines.return }}

  - name: Persist transect lines as gpkg
    id: persist_transect_lines_gpkg
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: gpkg
    mapvalues:
      argnames:
        - filename
        - df
      argvalues: ${{ workflow.zip_filename_transect_lines_df.return }}

  # Surface persisted file paths so a reviewer can copy one into the dsc_publish workflow.
  # Deliberately does NOT use any_keyed_iterables_are_skips here: with many independent
  # survey periods, it's normal for some individual period to have nothing persisted
  # (e.g. no visited transects that period) while others succeed. That check would treat
  # any single skipped period as reason to discard the *entire* combined list, hiding
  # every other period's real output. groupbykey's own SkippedDependencyFallback already
  # drops just the skipped entries and keeps the rest.
  - name: Zip persisted transects and patrol events paths
    id: zip_publish_paths
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.persist_transects_gpkg.return }}
        - ${{ workflow.persist_patrol_events_gpkg.return }}

  - name: Collect all persisted transects paths
    id: gather_transects_paths
    task: collect_transects_paths
    partial:
      zipped: ${{ workflow.zip_publish_paths.return }}

  - name: Collect all persisted patrol events paths
    id: gather_patrol_events_paths
    task: collect_patrol_events_paths
    partial:
      zipped: ${{ workflow.zip_publish_paths.return }}

  - name: Format publish file paths as text
    id: publish_paths_text
    task: ecoscope_workflows_ext_distance_sample_counts.tasks.transformation.format_publish_paths
    partial:
      transects_paths: ${{ workflow.gather_transects_paths.return }}
      patrol_events_paths: ${{ workflow.gather_patrol_events_paths.return }}

  - name: Create widget showing files ready to publish
    id: publish_paths_widget
    task: create_text_widget_single_view
    partial:
      title: "Files ready to publish"
      data: ${{ workflow.publish_paths_text.return }}

  - name: Overall dashboard
    id: overall_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return}}
      widgets: []
       # - ${{ workflow.publish_paths_widget.return }}
      time_range: ${{ workflow.time_range.return}}
      groupers: ${{ workflow.groupers.return }}
