id: dsc_analysis
requirements:
  - name: ecoscope-platform
    version: ">=2.25.3"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.5.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.28.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-distance-sample-counts
    version: "1.2.0.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

rjsf-overrides:
  properties:
    connection_config.properties.entries.title: "Conservancies"

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # ===========================================================================
  # Setup: run details, time range, Earth Engine, and the conservancies to read.
  # ===========================================================================
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range

  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial:
      groupers:
        - index_name: group_id
        - index_name: period

  - name: Configure Google Earth Engine
    id: gee_client
    task: set_gee_connection

  # One entry per conservancy. Its patrol types and transect groups are dropdowns filled from that entry's own
  # connection, and are turned into IDs here. Every fetch below takes this whole list, so the workflow has one
  # step per kind of data however many conservancies are in the run.
  - name: Connect to EarthRanger
    id: connection_config
    task: connect_sites

  # ===========================================================================
  # 1. Get events: every DSC event in the time range, with details and notes.
  # ===========================================================================
  - name: Fetch DSC events from every site
    id: site_events
    task: fetch_site_events
    partial:
      sites: ${{ workflow.connection_config.return }}
      time_range: ${{ workflow.time_range.return }}
      event_types:
        - distancecountwildlife_rep
        - distance_count_wildlife_sighting
        - distancecountpatrol_rep
        - distance_count_patrol_metadata
        - distance_count
      max_workers: 5

  # ===========================================================================
  # 2. Get patrols: the DSC patrols, the events on them, the survey periods they
  #    fall into, each period's metadata, events and field effort.
  # ===========================================================================
  - name: Fetch DSC patrols from every site
    id: site_patrols
    task: fetch_site_patrols
    partial:
      sites: ${{ workflow.connection_config.return }}
      time_range: ${{ workflow.time_range.return }}
      max_workers: 5

  - name: Link events to the patrols they were recorded on
    id: site_surveys
    task: link_events_to_patrols
    partial:
      sites: ${{ workflow.connection_config.return }}
      events: ${{ workflow.site_events.return }}
      patrols: ${{ workflow.site_patrols.return }}
      event_types:
        - distancecountwildlife_rep
        - distance_count_wildlife_sighting
        - distancecountpatrol_rep
        - distance_count_patrol_metadata
        - distance_count
      chunk_size: 75

  # A survey period is one survey round at a site, e.g. "mnc 2026_02". A new period starts after more than
  # max_gap_days without a patrol event; it is named after the month most of its events fall in.
  - name: Split each site into survey periods
    id: survey_periods
    task: split_survey_periods
    partial:
      surveys: ${{ workflow.site_surveys.return }}
      max_gap_days: 30

  - name: Build survey metadata per period
    id: survey_metadata
    task: build_survey_metadata
    partial:
      periods: ${{ workflow.survey_periods.return }}

  - name: Prepare sightings and patrol markers per period
    id: survey_events
    task: prepare_survey_events
    partial:
      periods: ${{ workflow.survey_periods.return }}
      time_range: ${{ workflow.time_range.return }}

  # span: "day" counts from a subject's first patrol start to its last patrol end each day (includes moving
  # between transects); "patrol" counts the time on patrols only.
  - name: Compute field effort per period
    id: field_effort
    task: compute_survey_effort
    partial:
      periods: ${{ workflow.survey_periods.return }}
      events: ${{ workflow.survey_events.return }}
      span: day
      default_team_size: 3
      max_speed_kmhr: 100
      max_patrol_hours: 12
      max_workers: 5

  # ===========================================================================
  # 3. Get transects: each site's transects, the corridors around them, where
  #    every event falls against its transect, and which transects were surveyed.
  # ===========================================================================
  - name: Fetch transects from every site
    id: master_transects
    task: fetch_site_transects
    partial:
      sites: ${{ workflow.connection_config.return }}
      max_workers: 5

  - name: Project transects and build survey corridors
    id: site_transects
    task: prepare_site_transects
    partial:
      transects: ${{ workflow.master_transects.return }}
      simplify_tolerance: 50
      corridor_half_width: 500
      cap_style: flat
      resolution: 5

  - name: Place events against their transects
    id: located_events
    task: locate_survey_events
    partial:
      events: ${{ workflow.survey_events.return }}
      transects: ${{ workflow.site_transects.return }}
      metadata: ${{ workflow.survey_metadata.return }}

  - name: Keep the transects surveyed in each period
    id: visited_transects
    task: select_visited_transects
    partial:
      transects: ${{ workflow.site_transects.return }}
      metadata: ${{ workflow.survey_metadata.return }}
      events: ${{ workflow.located_events.return }}

  - name: Surveyed transect lines per period
    id: transect_lines
    task: visited_transect_lines
    mapvalues:
      argnames: visited
      argvalues: ${{ workflow.visited_transects.return }}

  # ===========================================================================
  # 4. GEE covariate labelling: NDVI around the survey date, slope, woody cover.
  # ===========================================================================
  - name: Label surveyed transect areas with covariates
    id: transect_areas
    task: label_transect_covariates
    partial:
      client: ${{ workflow.gee_client.return }}
      visited: ${{ workflow.visited_transects.return }}
      periods: ${{ workflow.survey_periods.return }}
      transects: ${{ workflow.site_transects.return }}
      ndvi_window_days: 30
      ndvi_max_window_days: 90
      max_cloud_cover: 30
      dem_asset: "USGS/SRTMGL1_003"
      dry_season_start_month: 7
      dry_season_end_month: 9
      max_lookback_years: 3
      ndvi_scale: 30.0
      slope_scale: 30.0
      woody_scale: 50.0
      max_workers: 4

  # ===========================================================================
  # 5. Gather outputs: the analysis data, then every export file in its folder.
  # ===========================================================================
  - name: Build analysis data per period
    id: analysis_data
    task: build_analysis_data
    partial:
      events: ${{ workflow.located_events.return }}
      transect_areas: ${{ workflow.transect_areas.return }}

  - name: Select event columns for the events gpkg
    id: events_layer
    task: select_columns
    partial:
      columns: [
        "serial_number", "transect_id", "dist_to_centre",
        "ortho_dist", "intersects_transect", "geometry"
      ]
      raise_on_missing: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.analysis_data.return }}

  - name: Persist master transects snapshot as gpkg
    id: persist_master_transects_gpkg
    task: persist_survey_files
    partial:
      frames: ${{ workflow.master_transects.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      subfolder: ER_MasterTransects
      suffix: master_transects
      filetype: gpkg
      add_run_date: true

  - name: Persist survey metadata as csv
    id: persist_survey_event_metadata
    task: persist_survey_files
    partial:
      frames: ${{ workflow.survey_metadata.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      subfolder: ER_Metadata
      suffix: analysis_metadata
      filetype: csv
      add_run_date: false

  - name: Persist field effort as csv
    id: persist_field_effort
    task: persist_survey_files
    partial:
      frames: ${{ workflow.field_effort.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      subfolder: ER_FieldEffort
      suffix: field_effort
      filetype: csv
      add_run_date: false

  - name: Persist analysis data as csv
    id: persist_patrol_events_csv
    task: persist_survey_files
    partial:
      frames: ${{ workflow.analysis_data.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      subfolder: ER_AnalysisData
      suffix: analysis_data
      filetype: csv
      add_run_date: false

  - name: Persist events as gpkg
    id: persist_patrol_events_gpkg
    task: persist_survey_files
    partial:
      frames: ${{ workflow.events_layer.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      subfolder: ER_Events
      suffix: events
      filetype: gpkg
      add_run_date: false

  - name: Persist transect areas as gpkg
    id: persist_transects_gpkg
    task: persist_survey_files
    partial:
      frames: ${{ workflow.transect_areas.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      subfolder: ER_TransectAreas
      suffix: transect_areas
      filetype: gpkg
      add_run_date: false

  - name: Persist transect lines as gpkg
    id: persist_transect_lines_gpkg
    task: persist_survey_files
    partial:
      frames: ${{ workflow.transect_lines.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      subfolder: ER_TransectLines
      suffix: transect_lines
      filetype: gpkg
      add_run_date: false

  # Products built from every site and period together: combined latest transects and survey areas,
  # combined and processed metadata, and the quarterly survey log.
  - name: Write cross-survey analysis outputs
    id: cross_survey_outputs
    task: write_cross_survey_outputs
    partial:
      master_transects: ${{ workflow.master_transects.return }}
      transect_areas: ${{ workflow.transect_areas.return }}
      metadata: ${{ workflow.survey_metadata.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      subfolder: AnalysisOutputs
      exclude_surveys:
        - pardamat_2024_11
      crs: 32736

  # ===========================================================================
  # 6. Render outputs on the dashboard: one set of views per site and period.
  # Each widget is two steps: one builds the number, table or chart per period, one shows it.
  # ===========================================================================

  # ---- Tiles: effort, coverage and counts at a glance
  - name: Sum surveyed distance per period
    id: total_distance_per_period
    task: dataframe_column_sum
    partial:
      column_name: distance
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.field_effort.return }}

  - name: Show total distance
    id: total_distance_grouped_widget
    task: single_value_widget
    partial:
      values: ${{ workflow.total_distance_per_period.return }}
      title: "Total distance travelled during survey activity (km)"
      decimal_places: 1

  - name: Sum man-hours per period
    id: total_man_hours_per_period
    task: dataframe_column_sum
    partial:
      column_name: man_hours
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.field_effort.return }}

  - name: Show man-hours
    id: total_effort_grouped_widget
    task: single_value_widget
    partial:
      values: ${{ workflow.total_man_hours_per_period.return }}
      title: "Man-hours"
      decimal_places: 1

  - name: Count transects surveyed per period
    id: total_transects_per_period
    task: dataframe_column_nunique
    partial:
      column_name: name
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.transect_areas.return }}

  - name: Show transects surveyed
    id: total_transects_grouped_widget
    task: single_value_widget
    partial:
      values: ${{ workflow.total_transects_per_period.return }}
      title: "Number of Transects Surveyed"
      decimal_places: 0

  - name: List transects not surveyed per period
    id: missed_transects
    task: build_missed_transects
    partial:
      visited: ${{ workflow.visited_transects.return }}

  - name: Count transects not surveyed per period
    id: missed_transects_count
    task: count_rows
    partial:
      frames: ${{ workflow.missed_transects.return }}

  - name: Show transects not surveyed
    id: missed_transects_tile
    task: single_value_widget
    partial:
      values: ${{ workflow.missed_transects_count.return }}
      title: "Transects Not Surveyed"
      decimal_places: 0

  - name: Count sightings per period
    id: sightings_per_period
    task: sighting_totals
    partial:
      analysis: ${{ workflow.analysis_data.return }}
      metric: sightings

  - name: Show sightings
    id: sightings_tile
    task: single_value_widget
    partial:
      values: ${{ workflow.sightings_per_period.return }}
      title: "Sightings"
      decimal_places: 0

  - name: Count animals per period
    id: animals_per_period
    task: sighting_totals
    partial:
      analysis: ${{ workflow.analysis_data.return }}
      metric: animals

  - name: Show animals counted
    id: animals_tile
    task: single_value_widget
    partial:
      values: ${{ workflow.animals_per_period.return }}
      title: "Animals Counted"
      decimal_places: 0

  - name: Count species per period
    id: species_per_period
    task: sighting_totals
    partial:
      analysis: ${{ workflow.analysis_data.return }}
      metric: species

  - name: Show species seen
    id: species_tile
    task: single_value_widget
    partial:
      values: ${{ workflow.species_per_period.return }}
      title: "Species Seen"
      decimal_places: 0

  # ---- Survey overview map: surveyed corridors and lines, transects not surveyed, and sightings coloured by
  # species and sized by group size.
  - name: Map Base Layers
    id: base_map_defs
    task: set_base_maps

  - name: Create polygon layer for transect areas
    id: transect_areas_layer
    task: create_geojson_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      tooltip_columns: null
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [189, 183, 107]
        get_line_color: [189, 183, 107]
        get_line_width: 0.95
        opacity: 0.55
      legend:
        title: "Legend"
        values:
          - label: Transect Areas
            color: "#bdb76b"
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.transect_areas.return }}

  - name: Create polyline layer for transect lines
    id: transect_lines_layer
    task: create_geojson_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      tooltip_columns: null
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: [0, 0, 0]
        get_line_color: [0, 0, 0]
        get_line_width: 1.75
        opacity: 0.75
      legend:
        title: ""
        values:
          - label: Surveyed transects
            color: "#000000"
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.transect_lines.return }}

  - name: Lines of transects not surveyed per period
    id: missed_lines
    task: missed_transect_lines
    mapvalues:
      argnames: visited
      argvalues: ${{ workflow.visited_transects.return }}

  - name: Create polyline layer for transects not surveyed
    id: missed_lines_layer
    task: create_geojson_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      tooltip_columns: ["name"]
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [200, 30, 30]
        get_line_width: 2.5
        opacity: 0.85
      legend:
        title: ""
        values:
          - label: Transects not surveyed
            color: "#c81e1e"
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.missed_lines.return }}

  - name: Colour sightings by species and size them by group size
    id: styled_sightings
    task: style_sightings_for_map
    partial:
      analysis: ${{ workflow.analysis_data.return }}
      min_radius: 3
      max_radius: 14

  - name: Create point layer for sightings
    id: events_point_layer
    task: create_scatterplot_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      tooltip_columns: ["species", "animals", "transect_id"]
      data_url: null
      layer_style:
        get_fill_color: species_colour
        get_line_color: [40, 40, 40]
        get_line_width: 0.5
        get_radius: radius
        radius_units: pixels
        opacity: 0.85
        stroked: true
      legend:
        title: "Sightings (larger = more animals)"
        label_column: species_group
        color_column: species_colour
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.styled_sightings.return }}

  - name: Combine the map layers per period
    id: combined_survey_map_layers
    skipif:
      conditions:
        - any_dependency_skipped
      unpack_depth: 1
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.transect_areas_layer.return }}
        - ${{ workflow.transect_lines_layer.return }}
        - ${{ workflow.missed_lines_layer.return }}
        - ${{ workflow.events_point_layer.return }}

  - title: Map Zoom & Extent
    type: task-group
    description: Frame the map on the surveyed transect areas.
    tasks:
      - name: null
        id: zoom_to_envelope
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
        partial:
          expansion_factor: 1.35
        mapvalues:
          argnames: gdf
          argvalues: ${{ workflow.transect_areas.return }}

      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
        mapvalues:
          argnames: gdf
          argvalues: ${{ workflow.zoom_to_envelope.return }}

  - name: Pair each period's map layers with its view state
    id: layers_with_view_state
    task: pair_keyed
    partial:
      first: ${{ workflow.combined_survey_map_layers.return }}
      second: ${{ workflow.gdf_image_extent.return }}

  - name: Draw survey overview map
    id: survey_overview_map
    task: draw_map
    partial:
      output_type: html
      tile_layers: ${{ workflow.base_map_defs.return }}
      legend_style:
        placement: "bottom-right"
      static: false
      title: null
      max_zoom: 10
    mapvalues:
      argnames:
        - geo_layers
        - view_state
      argvalues: ${{ workflow.layers_with_view_state.return }}

  - name: Persist survey overview map html
    id: survey_overview_map_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: "survey_overview_map"
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.survey_overview_map.return }}

  - name: Create Survey Overview map widget per period
    id: survey_overview_map_single_views
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Survey Overview Map"
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.survey_overview_map_html.return }}

  - name: Merge per-period Survey Overview map widgets
    id: survey_overview_map_widget
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.survey_overview_map_single_views.return }}

  # ---- Charts
  - name: Draw animals counted per species
    id: species_chart
    task: draw_species_chart
    partial:
      analysis: ${{ workflow.analysis_data.return }}

  - name: Show animals counted per species
    id: species_chart_widget
    task: chart_widget
    partial:
      charts: ${{ workflow.species_chart.return }}
      title: "Animals Counted by Species"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: species_chart

  - name: Draw detection distance histogram
    id: distance_histogram
    task: draw_distance_histogram
    partial:
      analysis: ${{ workflow.analysis_data.return }}
      bin_width: 25
      max_distance: 500

  - name: Show detection distance histogram
    id: distance_histogram_widget
    task: chart_widget
    partial:
      charts: ${{ workflow.distance_histogram.return }}
      title: "Detection Distances"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: distance_histogram

  - name: Draw effort by day
    id: effort_by_day
    task: draw_effort_by_day
    partial:
      effort: ${{ workflow.field_effort.return }}

  - name: Show effort by day
    id: effort_by_day_widget
    task: chart_widget
    partial:
      charts: ${{ workflow.effort_by_day.return }}
      title: "Effort by Day"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: effort_by_day

  - name: Draw trends across the site's survey periods
    id: site_trends
    task: draw_site_trends
    partial:
      analysis: ${{ workflow.analysis_data.return }}
      transect_lines: ${{ workflow.transect_lines.return }}

  - name: Show trends across survey periods
    id: site_trends_widget
    task: chart_widget
    partial:
      charts: ${{ workflow.site_trends.return }}
      title: "Trends Across Survey Periods (this site)"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: site_trends

  # ---- Tables
  - name: List what needs a look in EarthRanger
    id: data_quality
    task: build_data_quality
    partial:
      periods: ${{ workflow.survey_periods.return }}
      events: ${{ workflow.survey_events.return }}
      located_events: ${{ workflow.located_events.return }}
      effort: ${{ workflow.field_effort.return }}
      max_patrol_hours: 12

  - name: Show data quality checks
    id: data_quality_widget
    task: table_widget
    partial:
      frames: ${{ workflow.data_quality.return }}
      title: "Data Quality Checks"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: data_quality_table

  - name: Show transects not surveyed
    id: missed_transects_widget
    task: table_widget
    partial:
      frames: ${{ workflow.missed_transects.return }}
      title: "Transects Not Surveyed"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: missed_transects_table

  - name: Calculate encounter rate per transect
    id: encounter_rates
    task: build_encounter_rates
    partial:
      analysis: ${{ workflow.analysis_data.return }}
      transect_lines: ${{ workflow.transect_lines.return }}

  - name: Show encounter rate per transect
    id: encounter_rates_widget
    task: table_widget
    partial:
      frames: ${{ workflow.encounter_rates.return }}
      title: "Encounter Rate per Transect"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: encounter_rates_table

  - name: Tabulate transect covariates
    id: transect_covariates
    task: build_transect_covariates
    partial:
      transect_areas: ${{ workflow.transect_areas.return }}

  - name: Show transect covariates
    id: transect_covariates_widget
    task: table_widget
    partial:
      frames: ${{ workflow.transect_covariates.return }}
      title: "Transect Covariates"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: transect_covariates_table

  # Readable headers for the dashboard tables only; the CSV exports keep the original column names.
  - name: Rename field effort columns for the table
    id: field_effort_display
    task: map_columns
    partial:
      drop_columns: []
      retain_columns: []
      raise_if_not_found: false
      duplicate_strategy: suffix
      rename_columns: {
        "survey_date": "Survey Date",
        "id": "Subject ID",
        "name": "Team Member",
        "team_size": "Team Size",
        "distance": "Distance (km)",
        "duration": "Duration (h)",
        "man_hours": "Man Hours",
      }
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.field_effort.return }}

  - name: Show field effort
    id: field_effort_table_widget
    task: table_widget
    partial:
      frames: ${{ workflow.field_effort_display.return }}
      title: "Field Effort"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: field_effort_table

  - name: Rename survey metadata columns for the table
    id: metadata_display
    task: map_columns
    partial:
      drop_columns: []
      retain_columns: []
      raise_if_not_found: false
      duplicate_strategy: suffix
      rename_columns: {
        "serial_number": "Serial Number",
        "event_type": "Event Type",
        "time": "Time",
        "latitude": "Latitude",
        "longitude": "Longitude",
        "reported_by": "Reported By",
      }
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.survey_metadata.return }}

  - name: Show survey metadata
    id: metadata_grouped_table_widget
    task: table_widget
    partial:
      frames: ${{ workflow.metadata_display.return }}
      title: "Survey Metadata"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: metadata_table

  - name: Select analysis data columns for the table (no geometry)
    id: analysis_table_columns
    task: select_columns
    partial:
      columns: [
        "transect_id", "patrol_serial_number", "serial_number", "time", "species", "other_species",
        "totalcount", "num_juveniles", "num_observers", "dist_to_centre", "radialangle",
        "off_transect_dist", "ortho_dist", "intersects_transect",
        "img_date_hsl_ndvi", "NDVI_HSL", "slope", "survey_id"
      ]
      raise_on_missing: false
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.analysis_data.return }}

  - name: Show analysis data
    id: analysis_data_table_widget
    task: table_widget
    partial:
      frames: ${{ workflow.analysis_table_columns.return }}
      title: "Analysis Data"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: analysis_data_table

  - name: Overall dashboard
    id: overall_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.total_distance_grouped_widget.return }}
        - ${{ workflow.total_effort_grouped_widget.return }}
        - ${{ workflow.total_transects_grouped_widget.return }}
        - ${{ workflow.missed_transects_tile.return }}
        - ${{ workflow.sightings_tile.return }}
        - ${{ workflow.animals_tile.return }}
        - ${{ workflow.species_tile.return }}
        - ${{ workflow.survey_overview_map_widget.return }}
        - ${{ workflow.species_chart_widget.return }}
        - ${{ workflow.distance_histogram_widget.return }}
        - ${{ workflow.effort_by_day_widget.return }}
        - ${{ workflow.site_trends_widget.return }}
        - ${{ workflow.data_quality_widget.return }}
        - ${{ workflow.missed_transects_widget.return }}
        - ${{ workflow.encounter_rates_widget.return }}
        - ${{ workflow.transect_covariates_widget.return }}
        - ${{ workflow.field_effort_table_widget.return }}
        - ${{ workflow.metadata_grouped_table_widget.return }}
        - ${{ workflow.analysis_data_table_widget.return }}
      time_range: ${{ workflow.time_range.return }}
      groupers: ${{ workflow.groupers.return }}
