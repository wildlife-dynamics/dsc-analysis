name: DSC Analysis
author:
  - name: Tevin Temu
    organization: Wildlife Dynamics
    email: tevin@wildlifedynamics.com

description: Processes Distance Sample Count (DSC) wildlife survey patrols from EarthRanger for one or more surveys, splits each survey into survey periods (a new period starts after 30 days without a patrol event), calculates distance sampling geometry and field effort, labels visited transects with Google Earth Engine environmental covariates, and exports analysis-ready datasets for population density modelling with a dashboard per survey period.
theory: "Observations follow line-transect distance sampling. Events and transects are reprojected to UTM, and for each sighting the workflow calculates the observer's perpendicular distance to the transect centreline, estimates the animal's position from the radial angle and distance to centre, and calculates the orthogonal distance from that position to the centreline. Each event is flagged for whether it falls within its transect's 500 m corridor, and a transect counts as surveyed if it has a patrol marker or a sighting that period. Surveyed transect corridors are labelled with mean HLS NDVI from images within 30 days of the survey start (max 30% cloud cover; the window widens only for transects with no clear pixel), terrain slope, and PALSAR woody cover (dry-season composite). Field effort is taken from the patrols that recorded sightings or markers: for each tracked subject and survey day, the hours from its first patrol start to its last patrol end, the length of its GPS track in that time, and man-hours from the number of observers reported."
output_comment: "For each survey period, outputs an analysis metadata CSV, a field effort CSV, an analysis data CSV of wildlife observations with distance sampling fields and covariates, an events GeoPackage, a visited transect areas GeoPackage (buffered corridors with NDVI, slope, and woody cover), and a visited transect lines GeoPackage, each in its own subfolder. The dashboard has one set of views per survey period: tiles for distance, man-hours, transects surveyed and not surveyed, sightings, animals and species; a survey overview map with sightings coloured by species and sized by group size; charts of animals by species, detection distances, effort by day and trends across the site's survey periods; and tables of data quality checks, transects not surveyed, encounter rate per transect, transect covariates, field effort, survey metadata and analysis data."
